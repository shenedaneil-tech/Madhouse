<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#10231c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MadHouse" />
  <link rel="manifest" href="manifest.webmanifest?v=9" />
  <link rel="stylesheet" href="styles.css?v=9" />
  <link rel="stylesheet" href="generated-art.css?v=9" />
  <title>MadHouse</title>
</head>
<body class="generated-art-ready">
  <main id="app">
    <section id="houseView" class="screen active">
      <div class="scene house-scene">
        <div class="stage-visual house-stage" aria-label="MadHouse home overview">
          <div class="house-tip"><span class="plumbob">◆</span><div><strong>Choose a room</strong><small>Tap or click a room to enter</small></div></div>
          <button class="room-zone bedroom-zone" data-room="bedroom"><span>Bedroom</span></button>
          <button class="room-zone bathroom-zone" data-room="bathroom"><span>Bathroom</span></button>
          <button class="room-zone office-zone" data-room="office"><span>Office</span></button>
          <button class="room-zone living-zone" data-room="living"><span>Living Room</span></button>
          <button class="room-zone kitchen-zone" data-room="kitchen"><span>Kitchen</span></button>
          <button class="room-zone garage-zone" data-room="garage"><span>Garage</span></button>
        </div>
        <header class="game-hud top-hud"><div class="brand"><div class="brand-mark">M</div><div><h1>MadHouse</h1><p>Everything under one roof</p></div></div></header>
        <aside class="game-hud desktop-rail" aria-hidden="true"></aside>
        <nav class="game-hud bottom-hud" aria-hidden="true"></nav>
      </div>
    </section>

    <section id="kitchenView" class="screen">
      <div class="scene kitchen-scene">
        <div class="stage-visual kitchen-stage" aria-label="Interactive MadHouse kitchen">
          <button id="artBackBtn" class="art-back-zone" aria-label="Back to house"></button>
          <div class="interaction-hint"><span class="plumbob">◆</span> Tap or click glowing objects</div>
          <button class="object-zone fridge-zone" data-tool="grocery"><span class="object-marker">◆</span><b>Fridge</b><small>Groceries</small></button>
          <button class="object-zone pantry-zone" data-tool="pantry"><span class="object-marker">◆</span><b>Pantry</b><small>Inventory</small></button>
          <button class="object-zone stove-zone" data-tool="planner"><span class="object-marker">◆</span><b>Stove</b><small>Meal planner</small></button>
          <button class="object-zone recipe-zone" data-tool="recipes"><span class="object-marker">◆</span><b>Recipe Book</b><small>Recipes</small></button>
          <button class="object-zone table-zone" data-tool="schedule"><span class="object-marker">◆</span><b>Dining Table</b><small>Meal schedule</small></button>
        </div>
        <header class="game-hud room-hud"><button id="backBtn" class="round-btn back-btn" aria-label="Back to house">←</button></header>
        <div id="toolPanel" class="tool-panel" aria-live="polite"><div class="panel-handle"></div><button id="closePanel" class="panel-close" aria-label="Close">×</button><div id="panelContent"></div></div>
        <nav class="game-hud room-dock" aria-hidden="true"></nav>
      </div>
    </section>
  </main>
  <script src="app.js?v=9"></script>
</body>
</html>
