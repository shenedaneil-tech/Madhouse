<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#10231c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MadHouse" />
  <link rel="manifest" href="manifest.webmanifest?v=11" />
  <link rel="stylesheet" href="styles.css?v=11" />
  <link rel="stylesheet" href="generated-art.css?v=11" />
  <title>MadHouse</title>
</head>
<body class="generated-art-ready">
  <main id="app">
    <section id="houseView" class="screen active">
      <div class="scene house-scene">
        <div class="stage-visual house-stage" aria-label="MadHouse home overview">
          <img class="scene-art" src="assets/house-game.webp?v=11" alt="MadHouse illustrated home" />
          <div class="art-error" aria-live="polite">House artwork could not be loaded.</div>
          <button class="room-zone bedroom-zone" data-room="bedroom"><span>Bedroom</span></button>
          <button class="room-zone bathroom-zone" data-room="bathroom"><span>Bathroom</span></button>
          <button class="room-zone office-zone" data-room="office"><span>Office</span></button>
          <button class="room-zone living-zone" data-room="living"><span>Living Room</span></button>
          <button class="room-zone kitchen-zone" data-room="kitchen"><span>Kitchen</span></button>
          <button class="room-zone garage-zone" data-room="garage"><span>Garage</span></button>
        </div>
      </div>
    </section>

    <section id="kitchenView" class="screen">
      <div class="scene kitchen-scene">
        <div class="stage-visual kitchen-stage" aria-label="Interactive MadHouse kitchen">
          <img class="scene-art" src="assets/kitchen-game.webp?v=11" alt="MadHouse illustrated kitchen" />
          <div class="art-error" aria-live="polite">Kitchen artwork could not be loaded.</div>
          <button id="artBackBtn" class="art-back-zone" aria-label="Back to house"></button>
          <button class="object-zone fridge-zone" data-tool="grocery" aria-label="Groceries"></button>
          <button class="object-zone pantry-zone" data-tool="pantry" aria-label="Pantry inventory"></button>
          <button class="object-zone stove-zone" data-tool="planner" aria-label="Meal planner"></button>
          <button class="object-zone recipe-zone" data-tool="recipes" aria-label="Saved recipes"></button>
          <button class="object-zone table-zone" data-tool="schedule" aria-label="Meal schedule"></button>
        </div>
        <button id="backBtn" class="offscreen-back" aria-label="Back to house"></button>
        <div id="toolPanel" class="tool-panel" aria-live="polite"><div class="panel-handle"></div><button id="closePanel" class="panel-close" aria-label="Close">×</button><div id="panelContent"></div></div>
      </div>
    </section>
  </main>
  <script src="app.js?v=11"></script>
  <script>
    document.querySelectorAll('.scene-art').forEach(img=>{
      img.addEventListener('load',()=>img.closest('.stage-visual')?.classList.add('art-loaded'));
      img.addEventListener('error',()=>img.closest('.stage-visual')?.classList.add('art-failed'));
      if(img.complete){img.naturalWidth ? img.closest('.stage-visual')?.classList.add('art-loaded') : img.closest('.stage-visual')?.classList.add('art-failed');}
    });
  </script>
</body>
</html>
